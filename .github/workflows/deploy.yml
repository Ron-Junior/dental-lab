name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/prod/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/protho-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Bitwarden CLI & Fetch .env
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
        run: |
          npm install -g @bitwarden/cli
          
          export BW_SESSION="$(bw login --apikey --raw && bw unlock "${BW_PASSWORD}" --raw)"
          
          bw get item "producao-env" | jq -r '.notes' > .env
          
          if [ ! -s .env ]; then
            echo "Erro: O arquivo .env veio vazio do Bitwarden!"
            exit 1
          fi

      - name: Deploy to Oracle VPS via SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/protho-app:latest
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 $USER@$HOST "export IMAGE='$IMAGE'; bash -s" << 'EOF'
            set -e
            
            cd /var/www/prod-protho
            
            # Atualiza o repositório
            git pull origin master
            
            cd deploy/prod
             
            # Puxa a imagem pronta e otimizada do Docker Hub usando a variável IMAGE
            docker compose pull
            docker compose up -d --force-recreate
            
            # Executa os comandos artisan no container rodando
            docker exec laravel_app_prod php artisan migrate --force
            docker exec laravel_app_prod php artisan config:cache
            docker exec laravel_app_prod php artisan route:cache
            docker exec laravel_app_prod php artisan view:cache
          EOF