name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Oracle VPS via SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            cd /var/www/prod-protho
            
            git pull origin master
            
            cd deploy
            
            docker compose down
            docker compose up -d --build
            
            docker exec laravel_redis_prod php artisan migrate --force
            docker exec laravel_redis_prod php artisan config:cache
            docker exec laravel_redis_prod php artisan route:cache
            docker exec laravel_redis_prod php artisan view:cache
          EOF