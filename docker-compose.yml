services:
  app:
    image: node:22-alpine
    container_name: laravel_dev
    working_dir: /var/www
    ports:
      - "80:10000"
      - "5173:5173"
    volumes:
      - .:/var/www
    entrypoint: >
      sh -c "apk add --no-cache php85 php85-cli php85-phar php85-openssl php85-mbstring php85-tokenizer php85-xml php85-simplexml php85-iconv php85-xmlwriter php85-session php85-pdo php85-pdo_pgsql php85-pgsql php85-pdo_sqlite php85-sqlite3 php85-curl php85-dom php85-fileinfo php85-gd php85-pecl-redis composer && 
             ln -sf /usr/bin/php85 /usr/bin/php && 
             composer install && 
             php artisan package:discover --ansi && 
             php artisan serve --host=0.0.0.0 --port=10000"
    networks:
      - dev-network

  postgres:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000" # Porta da API S3
      - "9001:9001" # Porta do Console Web
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_LICENSE=${MINIO_LICENSE}
    volumes:
      - minio_data:/minio/data
    command: server /data --console-address ":9001"
    networks:
      - dev-network
  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-network

  queue_worker:
    image: node:22-alpine
    container_name: laravel_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: >
      sh -c "apk add --no-cache php85 php85-cli php85-phar php85-openssl php85-mbstring php85-tokenizer php85-xml php85-simplexml php85-dom php85-iconv php85-xmlwriter php85-session php85-pdo php85-pdo_pgsql php85-pgsql php85-curl php85-fileinfo php85-pecl-redis && \
             ln -sf /usr/bin/php85 /usr/bin/php && \
             php artisan queue:work redis --sleep=3 --tries=3 --max-jobs=100 --memory=128"
    depends_on:
      - redis
      - postgres
    networks:
      - dev-network
networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
