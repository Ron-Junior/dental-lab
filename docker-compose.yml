services:
  app:
    image: node:22-alpine
    container_name: laravel_dev
    working_dir: /var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
    entrypoint: >
      sh -c "
      apk add --no-cache php84 php84-cli php84-phar php84-openssl php84-mbstring 
      php84-tokenizer php84-xml php84-pdo php84-pdo_pgsql php84-pgsql php84-curl 
      php84-dom php84-xmlwriter php84-session php84-fileinfo php84-gd composer && 
      ln -sf /usr/bin/php84 /usr/bin/php && 
      php artisan serve --host=0.0.0.0 --port=8000
      "
    networks:
      - dev-network

  postgres:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local