services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_lab
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "10000:10000"
      - "5173:5173"
    networks: 
      - dental_lab_network

  db:
    image: postgres:18-alpine
    container_name: dental_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/18/main
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - dental_lab_network

networks:
  dental_lab_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local