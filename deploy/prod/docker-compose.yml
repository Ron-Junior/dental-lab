services:
  app:
    image: ${IMAGE}
    container_name: laravel_app_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - VIRTUAL_HOST=163.176.25.186
      - LETSENCRYPT_HOST=163.176.25.186
    volumes:
      - ../../storage:/var/www/prod-protho/storage
      - /var/www/prod-protho/deploy/prod/certs/origin.pem:/etc/ssl/certs/server.crt
      - /var/www/prod-protho/deploy/prod/certs/origin.key:/etc/ssl/private/server.key
    networks:
      - prod-network

  redis:
    image: redis:alpine
    container_name: laravel_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - prod-network

  queue_worker:
    image: node:22-alpine
    container_name: laravel_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: >
      sh -c "apk add --no-cache php83 php83-cli php83-phar php83-openssl php83-mbstring php83-tokenizer php83-xml php83-simplexml php83-iconv php83-xmlwriter php83-session php83-pdo php83-pdo_pgsql php83-pgsql php83-curl php83-fileinfo php83-pecl-redis && 
             ln -sf /usr/bin/php83 /usr/bin/php && 
             php artisan queue:work redis --sleep=3 --tries=3 --max-jobs=100 --memory=128"
    depends_on:
      - redis
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge
    enable_ipv6: true

volumes:
  redis_data_prod:
    driver: local
