services:
  app:
    image: ${IMAGE}
    container_name: laravel_app_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - VIRTUAL_HOST=163.176.25.186
      - LETSENCRYPT_HOST=163.176.25.186
    volumes:
      - ../../storage:/var/www/prod-protho/storage
      - /var/www/prod-protho/deploy/prod/certs/origin.pem:/etc/ssl/certs/server.crt
      - /var/www/prod-protho/deploy/prod/certs/origin.key:/etc/ssl/private/server.key
    networks:
      - prod-network

  redis:
    image: redis:alpine
    container_name: laravel_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - prod-network

  queue_worker:
    image: node:22-alpine
    container_name: laravel_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: >
      sh -c "apk add --no-cache php85 php85-cli php85-phar php85-openssl php85-mbstring php85-tokenizer php85-xml php85-simplexml php85-iconv php85-xmlwriter php85-session php85-pdo php85-pdo_pgsql php85-pgsql php85-curl php85-fileinfo php85-pecl-redis && 
             ln -sf /usr/bin/php85 /usr/bin/php && 
             php artisan queue:work redis --sleep=3 --tries=3 --max-jobs=100 --memory=128"
    depends_on:
      - redis
      - postgres
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  redis_data_prod:
    driver: local
