services:
  app:
    image: ${IMAGE}
    container_name: laravel_app_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - VIRTUAL_HOST=163.176.25.186
      - LETSENCRYPT_HOST=163.176.25.186
    volumes:
      - ../../storage:/var/www/prod-protho/storage
      - /var/www/prod-protho/deploy/prod/certs/origin.pem:/etc/ssl/certs/server.crt
      - /var/www/prod-protho/deploy/prod/certs/origin.key:/etc/ssl/private/server.key
    networks:
      - prod-network

  redis:
    image: redis:alpine
    container_name: laravel_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  redis_data_prod:
    driver: local
